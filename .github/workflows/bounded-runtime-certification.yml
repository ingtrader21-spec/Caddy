name: Caddy bounded runtime certification

on:
  push:
    branches: [production]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: caddy-bounded-runtime-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bounded-staging-runtime:
    name: bounded-staging-runtime
    runs-on: [self-hosted, codestra-staging]
    environment: staging-readonly
    timeout-minutes: 90
    outputs:
      image: ${{ steps.candidate.outputs.image }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
      config_sha256: ${{ steps.candidate.outputs.config_sha256 }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      staging_evidence_sha256: ${{ steps.staging_evidence.outputs.sha256 }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      CADDY_STAGING_ENV_FILE: ${{ vars.CADDY_STAGING_ENV_FILE }}
      CADDY_STAGING_DATA_SOURCE: ${{ vars.CADDY_STAGING_DATA_SOURCE }}
      CADDY_STAGING_MTLS_CLIENT_CERT: ${{ vars.CADDY_STAGING_MTLS_CLIENT_CERT }}
      CADDY_STAGING_MTLS_CLIENT_KEY: ${{ vars.CADDY_STAGING_MTLS_CLIENT_KEY }}
      CADDY_STAGING_MTLS_CA_CERT: ${{ vars.CADDY_STAGING_MTLS_CA_CERT }}
      CADDY_STAGING_N8N_CLIENT_SECRET_FILE: ${{ vars.CADDY_STAGING_N8N_CLIENT_SECRET_FILE || '/etc/codestra/caddy/secrets/n8n-automation-client-secret' }}
    steps:
      - name: Record canonical staging runner contract
        run: |
          set -Eeuo pipefail
          echo CADDY_STAGING_RUNNER_LABEL=codestra-staging
          echo CADDY_STAGING_ENVIRONMENT=staging-readonly

      - name: Require bounded staging paths
        run: |
          set -Eeuo pipefail
          for value in \
            "$CADDY_STAGING_ENV_FILE" \
            "$CADDY_STAGING_DATA_SOURCE" \
            "$CADDY_STAGING_MTLS_CLIENT_CERT" \
            "$CADDY_STAGING_MTLS_CLIENT_KEY" \
            "$CADDY_STAGING_MTLS_CA_CERT" \
            "$CADDY_STAGING_N8N_CLIENT_SECRET_FILE"; do
            test -n "$value"
            [[ "$value" = /* && "$value" != *..* && "$value" != *//* ]]
          done

      - name: Check out exact protected production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact production authority
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/production
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin production --depth=1
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: candidate
        name: Wait for and verify the signed immutable production candidate
        run: |
          set -Eeuo pipefail
          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER}/codestra-caddy:${SOURCE_SHA}"
          image=''
          for attempt in $(seq 1 120); do
            if docker pull "$tag" >/dev/null 2>&1; then
              image="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
                | grep -E "^ghcr\.io/${GITHUB_REPOSITORY_OWNER}/codestra-caddy@sha256:[0-9a-f]{64}$" \
                | head -n1 || true)"
              if [[ -n "$image" ]] \
                && cosign verify \
                  --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "$image" >/dev/null 2>&1 \
                && cosign verify-attestation \
                  --type https://codestra.co/attestations/caddy-source/v2 \
                  --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "$image" > verified-staging-attestation.json 2>/dev/null; then
                break
              fi
            fi
            image=''
            if [[ "$attempt" -eq 120 ]]; then
              echo CADDY_SIGNED_CANDIDATE=FAIL:release_unavailable >&2
              exit 2
            fi
            sleep 30
          done

          config_sha256="$(python3 scripts/hash_config_tree.py config)"
          image_digest="${image##*@}"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = \
            "https://github.com/${GITHUB_REPOSITORY}"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "io.codestra.caddy.config.sha256"}}')" = "$config_sha256"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 65532:65532

          printf 'source_sha=%s\nimage=%s\nimage_digest=%s\nconfig_sha256=%s\n' \
            "$SOURCE_SHA" "$image" "$image_digest" "$config_sha256" >> "$GITHUB_OUTPUT"
          echo CADDY_SIGNED_CANDIDATE=PASS

      - name: Deploy and certify exact digest on the bounded staging runtime
        env:
          CADDY_STAGING_IMAGE: ${{ steps.candidate.outputs.image }}
          CADDY_STAGING_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          CADDY_STAGING_CONFIG_SHA256: ${{ steps.candidate.outputs.config_sha256 }}
        run: |
          set -o pipefail
          bash scripts/bounded-staging-runtime-v2.sh | tee bounded-staging-runtime.txt

      - id: staging_evidence
        name: Bind Caddy, Kong, Middleware, and staging evidence to the production canary
        run: |
          set -Eeuo pipefail
          test -s bounded-staging-runtime-evidence.json
          test -s caddy-kong-middleware-runtime-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path("caddy-kong-middleware-runtime-evidence.json").read_text())
          assert runtime["schema"] == "codestra.caddy-kong-middleware-runtime.v1"
          assert runtime["route"]["caddy_to_kong_to_middleware"] == "PASS"
          assert runtime["route"]["method"] == "GET"
          assert runtime["route"]["status"] == 404
          assert runtime["route"]["middleware_error_code"] == "command_not_found"
          assert runtime["middleware"]["environment"] == "staging"
          assert runtime["application_mutations"] == 0
          assert runtime["provider_effects"] == 0
          assert runtime["external_effects_authorized"] is False
          assert runtime["result"] == "PASS"
          PY
          sha256sum \
            bounded-staging-runtime-evidence.json \
            caddy-kong-middleware-runtime-evidence.json \
            verified-staging-attestation.json \
            > staging-evidence.SHA256SUMS
          sha256sum --check --strict staging-evidence.SHA256SUMS
          echo "sha256=$(sha256sum staging-evidence.SHA256SUMS | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload bounded staging runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-bounded-staging-runtime-${{ steps.candidate.outputs.source_sha }}
          path: |
            bounded-staging-runtime-evidence.json
            caddy-kong-middleware-runtime-evidence.json
            staging-evidence.SHA256SUMS
            bounded-staging-runtime.txt
            verified-staging-attestation.json
          if-no-files-found: error

  production-readonly-canary:
    name: production-readonly-canary
    needs: bounded-staging-runtime
    runs-on: [self-hosted, codestra-production-canary]
    environment: production-readonly-canary
    timeout-minutes: 45
    env:
      CADDY_CANARY_SOURCE_SHA: ${{ needs.bounded-staging-runtime.outputs.source_sha }}
      CADDY_CANARY_IMAGE: ${{ needs.bounded-staging-runtime.outputs.image }}
      CADDY_CANARY_IMAGE_DIGEST: ${{ needs.bounded-staging-runtime.outputs.image_digest }}
      CADDY_CANARY_CONFIG_SHA256: ${{ needs.bounded-staging-runtime.outputs.config_sha256 }}
      CADDY_STAGING_EVIDENCE_SHA256: ${{ needs.bounded-staging-runtime.outputs.staging_evidence_sha256 }}
      CADDY_PRODUCTION_MTLS_CLIENT_CERT: ${{ vars.CADDY_PRODUCTION_MTLS_CLIENT_CERT }}
      CADDY_PRODUCTION_MTLS_CLIENT_KEY: ${{ vars.CADDY_PRODUCTION_MTLS_CLIENT_KEY }}
      CADDY_PRODUCTION_MTLS_CA_CERT: ${{ vars.CADDY_PRODUCTION_MTLS_CA_CERT }}
    steps:
      - name: Record canonical production canary runner contract
        run: |
          set -Eeuo pipefail
          echo CADDY_PRODUCTION_RUNNER_LABEL=codestra-production-canary
          echo CADDY_PRODUCTION_ENVIRONMENT=production-readonly-canary

      - name: Require production read-only probe paths
        run: |
          set -Eeuo pipefail
          [[ "$CADDY_STAGING_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          for value in \
            "$CADDY_PRODUCTION_MTLS_CLIENT_CERT" \
            "$CADDY_PRODUCTION_MTLS_CLIENT_KEY" \
            "$CADDY_PRODUCTION_MTLS_CA_CERT"; do
            test -n "$value"
            [[ "$value" = /* && "$value" != *..* && "$value" != *//* ]]
          done

      - name: Check out the same exact protected production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CADDY_CANARY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the same immutable source and configuration
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CADDY_CANARY_SOURCE_SHA"
          git fetch origin production --depth=1
          test "$(git rev-parse origin/production)" = "$CADDY_CANARY_SOURCE_SHA"
          test "$(python3 scripts/hash_config_tree.py config)" = "$CADDY_CANARY_CONFIG_SHA256"
          test "$CADDY_CANARY_IMAGE" = \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/codestra-caddy@${CADDY_CANARY_IMAGE_DIGEST}"

      - name: Download the exact staging and Middleware proof packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: caddy-bounded-staging-runtime-${{ env.CADDY_CANARY_SOURCE_SHA }}
          path: staging-evidence

      - name: Verify the bound staging and Middleware proof packet
        run: |
          set -Eeuo pipefail
          test "$(sha256sum staging-evidence/staging-evidence.SHA256SUMS | awk '{print $1}')" = \
            "$CADDY_STAGING_EVIDENCE_SHA256"
          (
            cd staging-evidence
            sha256sum --check --strict staging-evidence.SHA256SUMS
          )
          python3 - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("staging-evidence/caddy-kong-middleware-runtime-evidence.json").read_text())
          assert value["route"]["caddy_to_kong_to_middleware"] == "PASS"
          assert value["route"]["method"] == "GET"
          assert value["application_mutations"] == 0
          assert value["provider_effects"] == 0
          assert value["external_effects_authorized"] is False
          assert value["result"] == "PASS"
          PY

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the same signature and source attestation
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CADDY_CANARY_IMAGE" >/dev/null
          cosign verify-attestation \
            --type https://codestra.co/attestations/caddy-source/v2 \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CADDY_CANARY_IMAGE" > verified-production-attestation.json

      - name: Run bounded production read-only canary
        run: |
          set -o pipefail
          bash scripts/bounded-production-readonly-canary-v2.sh | tee production-readonly-canary.txt

      - name: Record the exact staging evidence identity
        run: printf 'STAGING_EVIDENCE_SHA256=%s\n' "$CADDY_STAGING_EVIDENCE_SHA256" > staging-evidence-identity.txt

      - name: Upload production read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-production-readonly-canary-${{ env.CADDY_CANARY_SOURCE_SHA }}
          path: |
            production-canary-evidence.json
            production-readonly-canary.txt
            pre-canary-runtime.json
            post-canary-runtime.json
            verified-production-attestation.json
            staging-evidence-identity.txt
            staging-evidence/caddy-kong-middleware-runtime-evidence.json
            staging-evidence/staging-evidence.SHA256SUMS
          if-no-files-found: error
