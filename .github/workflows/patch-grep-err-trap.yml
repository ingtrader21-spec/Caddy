name: Patch certification grep ERR handling

on:
  push:
    branches: [fix/caddy-certification-sandbox-20260903]
    paths:
      - .github/workflows/patch-grep-err-trap.yml

permissions:
  contents: write

jobs:
  patch-grep-handling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/caddy-certification-sandbox-20260903
          fetch-depth: 0

      - name: Evaluate grep inside conditionals so ERR traps remain fail closed
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/runtime-canary-test.sh"): (
                  '''  set +e
            grep -R -F --quiet -- "$secret" "$WORK/logs"
            grep_status=$?
            set -e
          ''',
                  '''  if grep -R -F --quiet -- "$secret" "$WORK/logs"; then
            grep_status=0
          else
            grep_status=$?
          fi
          ''',
              ),
              Path("scripts/bounded-staging-runtime-v2.sh"): (
                  '''  set +e
            grep -R -F --quiet -- "$secret" "$work/logs"
            grep_status=$?
            set -e
          ''',
                  '''  if grep -R -F --quiet -- "$secret" "$work/logs"; then
            grep_status=0
          else
            grep_status=$?
          fi
          ''',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"grep block not found: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_certification_evidence_fail_closed.py")
          text = tests.read_text(encoding="utf-8")
          if text.count('"grep -R -F --quiet",') != 2:
              raise SystemExit("expected two grep-token assertions")
          text = text.replace('"grep -R -F --quiet",', '"if grep -R -F --quiet",')
          text = text.replace('"grep_status=$?",', '"grep_status=0",\n            "grep_status=$?",')
          tests.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/patch-grep-err-trap.yml
          git diff --check
          python3 -m unittest tests.test_certification_evidence_fail_closed

      - name: Commit the self-cleaning patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/runtime-canary-test.sh scripts/bounded-staging-runtime-v2.sh tests/test_certification_evidence_fail_closed.py
          git commit -m 'fix(certification): isolate grep status from ERR traps'
          git push origin HEAD:fix/caddy-certification-sandbox-20260903
