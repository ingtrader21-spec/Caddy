name: Apply Caddy branch ruleset

on:
  workflow_dispatch:
  push:
    branches: [development, test, staging, production, main]
    paths:
      - .github/workflows/apply-branch-ruleset.yml
      - config/github/protected-branches-ruleset.json

permissions:
  contents: read

jobs:
  apply-ruleset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require repository-administration credential
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_GITHUB_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          payload=config/github/protected-branches-ruleset.json
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq '.[] | select(.name == "Protect Caddy promotion branches") | .id' | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/$existing" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/rulesets" --input "$payload" >/dev/null
          fi
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq '.[] | select(.name == "Protect Caddy promotion branches") | .enforcement')"
          test "$actual" = active
          echo CADDY_BRANCH_RULESET_APPLIED=PASS
