name: Apply Caddy branch ruleset

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_CADDY_PROMOTION_RULESET to create or update the canonical five-branch policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: caddy-promotion-governance
  cancel-in-progress: false

jobs:
  apply-ruleset:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_CADDY_PROMOTION_RULESET'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
    steps:
      - name: Check out exact protected main authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact protected source and administrative authority
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          if [[ -z "$GH_TOKEN" ]]; then
            echo CADDY_BRANCH_RULESET_APPLY=FAIL:missing_CODESTRA_REPOSITORY_ADMIN_TOKEN >&2
            exit 2
          fi

      - name: Validate, apply, and independently read back the canonical policy
        run: |
          set -Eeuo pipefail
          payload=config/github/protected-branches-ruleset.json
          canonical_name='Protect Caddy promotion branches'
          expected_refs='refs/heads/development,refs/heads/main,refs/heads/production,refs/heads/staging,refs/heads/test'
          expected_checks='immutable-release-gate,promotion-guard,validate-merge-result,validate-source'

          jq -e --arg refs "$expected_refs" --arg checks "$expected_checks" '
            .name == "Protect Caddy promotion branches" and
            .target == "branch" and
            .enforcement == "active" and
            (.bypass_actors | length) == 0 and
            ([.conditions.ref_name.include[]] | sort | join(",")) == $refs and
            ([.rules[] | select(.type == "pull_request") | .parameters.required_approving_review_count][0]) == 1 and
            ([.rules[] | select(.type == "pull_request") | .parameters.dismiss_stale_reviews_on_push][0]) == true and
            ([.rules[] | select(.type == "pull_request") | .parameters.require_last_push_approval][0]) == true and
            ([.rules[] | select(.type == "pull_request") | .parameters.required_review_thread_resolution][0]) == true and
            ([.rules[] | select(.type == "pull_request") | .parameters.allowed_merge_methods[]] | join(",")) == "squash" and
            ([.rules[] | select(.type == "required_linear_history")] | length) == 1 and
            ([.rules[] | select(.type == "non_fast_forward")] | length) == 1 and
            ([.rules[] | select(.type == "deletion")] | length) == 1 and
            ([.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | sort | join(",")) == $checks
          ' "$payload" >/dev/null

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq ".[] | select(.name == \"$canonical_name\") | .id" | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/$existing" --input "$payload" >/dev/null
            canonical_id="$existing"
            operation=updated
          else
            canonical_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/rulesets" --input "$payload" --jq '.id')"
            operation=created
          fi
          [[ "$canonical_id" =~ ^[0-9]+$ ]]

          gh api "repos/${GITHUB_REPOSITORY}/rulesets/$canonical_id" > caddy-promotion-ruleset-readback.json
          python3 scripts/verify_ruleset_readback.py "$payload" caddy-promotion-ruleset-readback.json

          jq -n \
            --arg operation "$operation" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson ruleset_id "$canonical_id" \
            '{schema:"codestra.caddy.governance-application.v1",operation:$operation,source_sha:$source_sha,ruleset_id:$ruleset_id,verified:true,bypass_actors:0,required_approvals:1,require_last_push_approval:true,merge_method:"squash",linear_history:true,runtime_changed:false}' \
            > caddy-promotion-ruleset-result.json
          echo CADDY_BRANCH_RULESET_APPLIED=PASS
          echo CADDY_BRANCH_RULESET_READBACK=PASS
          echo CADDY_RUNTIME_CHANGED=NO

      - name: Upload non-secret governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-promotion-governance-${{ github.sha }}
          path: |
            caddy-promotion-ruleset-readback.json
            caddy-promotion-ruleset-result.json
          if-no-files-found: error
          retention-days: 90
