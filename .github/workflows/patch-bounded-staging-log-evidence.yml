name: Patch bounded staging log evidence

on:
  push:
    branches: [fix/caddy-certification-sandbox-20260903]
    paths:
      - .github/workflows/patch-bounded-staging-log-evidence.yml

permissions:
  contents: write

jobs:
  patch-log-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/caddy-certification-sandbox-20260903
          fetch-depth: 0
      - name: Make bounded staging log inspection fail closed
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/bounded-staging-runtime-v2.sh")
          text = path.read_text(encoding="utf-8")
          old = '''docker_cmd stop --time 15 "$CANDIDATE" >/dev/null
          for secret in bounded-staging-auth-secret bounded-staging-cookie-secret bounded-staging-api-key-secret bounded-staging-query-secret bounded-staging-code-secret bounded-staging-state-secret; do
            ! grep -R -F "$secret" "$work/logs" || fail log_redaction
           done
          '''
          new = '''docker_cmd stop --time 15 "$CANDIDATE" >/dev/null

          if ! find "$work/logs" -type f -print -quit | grep -q .; then
            echo BOUNDED_STAGING_LOGS=FAIL:no_access_logs >&2
            exit 2
          fi
          if find "$work/logs" -type f ! -readable -print -quit | grep -q .; then
            if [[ "$(id -u)" -eq 0 ]]; then
              chown -R "$(id -u):$(id -g)" "$work/logs"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n chown -R "$(id -u):$(id -g)" "$work/logs"
            else
              echo BOUNDED_STAGING_LOGS=FAIL:read_access_logs >&2
              exit 2
            fi
          fi
          while IFS= read -r -d '' log_file; do
            [[ -r "$log_file" ]] || {
              echo BOUNDED_STAGING_LOGS=FAIL:unreadable_access_log >&2
              exit 2
            }
          done < <(find "$work/logs" -type f -print0)

          for secret in bounded-staging-auth-secret bounded-staging-cookie-secret bounded-staging-api-key-secret bounded-staging-query-secret bounded-staging-code-secret bounded-staging-state-secret; do
            set +e
            grep -R -F --quiet -- "$secret" "$work/logs"
            grep_status=$?
            set -e
            case "$grep_status" in
              0) fail log_redaction ;;
              1) ;;
              *)
                echo BOUNDED_STAGING_LOGS=FAIL:grep_error >&2
                exit 2
                ;;
            esac
          done
          '''
          if old not in text:
              raise SystemExit("bounded staging log block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_certification_evidence_fail_closed.py")
          source = tests.read_text(encoding="utf-8")
          anchor = '''        self.assertNotIn('! grep -R -F "$secret"', script)
          '''
          addition = '''        self.assertNotIn('! grep -R -F "$secret"', script)

              def test_bounded_staging_redaction_rejects_log_read_errors(self):
                  script = (ROOT / "scripts/bounded-staging-runtime-v2.sh").read_text()
                  for token in (
                      "BOUNDED_STAGING_LOGS=FAIL:no_access_logs",
                      "BOUNDED_STAGING_LOGS=FAIL:read_access_logs",
                      "BOUNDED_STAGING_LOGS=FAIL:unreadable_access_log",
                      "BOUNDED_STAGING_LOGS=FAIL:grep_error",
                      "grep -R -F --quiet",
                      "grep_status=$?",
                      'case "$grep_status" in',
                  ):
                      self.assertIn(token, script)
                  self.assertNotIn('! grep -R -F "$secret"', script)
          '''
          if anchor not in source:
              raise SystemExit("test anchor not found")
          tests.write_text(source.replace(anchor, addition, 1), encoding="utf-8")
          PY
          git rm .github/workflows/patch-bounded-staging-log-evidence.yml
          git diff --check
          python3 -m unittest tests.test_certification_evidence_fail_closed
      - name: Commit the self-cleaning patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/bounded-staging-runtime-v2.sh tests/test_certification_evidence_fail_closed.py
          git commit -m 'fix(staging): require readable redaction logs'
          git push origin HEAD:fix/caddy-certification-sandbox-20260903
