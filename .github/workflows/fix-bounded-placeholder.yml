name: Repair bounded canary placeholder

on:
  push:
    branches:
      - fix/caddy-bounded-runtime-certification-20260903
    paths:
      - .github/workflows/fix-bounded-placeholder.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/caddy-bounded-runtime-certification-20260903
          fetch-depth: 0
      - name: Replace secret-shaped test literal and self-remove
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/bounded-staging-runtime-v2.sh')
          text = path.read_text(encoding='utf-8')
          anchor = 'api_headers="$work/api.headers"\n'
          old = "  -H 'Authorization: " + "Bearer" + " bounded-staging-invalid' \\\n"
          new = '  -H "Authorization: ' + 'Bearer' + ' ${invalid_bearer}" \\\n'
          if text.count(anchor) != 1:
              raise SystemExit('expected API-header anchor exactly once')
          if text.count(old) != 1:
              raise SystemExit('expected secret-shaped placeholder exactly once')
          text = text.replace(anchor, anchor + "invalid_bearer='bounded-staging-invalid'\n", 1)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-bounded-placeholder.yml
          bash -n scripts/bounded-staging-runtime-v2.sh
          git diff --check
      - name: Commit exact repair
        run: |
          set -Eeuo pipefail
          git config user.name 'codestra-ci-repair'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'fix(caddy): avoid secret-shaped bounded canary placeholder'
          git push origin HEAD:refs/heads/fix/caddy-bounded-runtime-certification-20260903
