name: Promotion guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - development
      - test
      - staging
      - production
      - main

permissions:
  contents: read

jobs:
  enforce-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source and target branches
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Promotion: $HEAD -> $BASE"

          case "$BASE" in
            development)
              if [[ ! "$HEAD" =~ ^(feat|fix|chore|docs|refactor)/ ]]; then
                echo "development accepts only feature/fix/chore/docs/refactor branches." >&2
                exit 1
              fi
              ;;
            test)
              [[ "$HEAD" == "development" ]] || {
                echo "test accepts promotion only from development." >&2
                exit 1
              }
              ;;
            staging)
              [[ "$HEAD" == "test" ]] || {
                echo "staging accepts promotion only from test." >&2
                exit 1
              }
              ;;
            production)
              [[ "$HEAD" == "staging" ]] || {
                echo "production accepts promotion only from staging." >&2
                exit 1
              }
              ;;
            main)
              [[ "$HEAD" == "production" ]] || {
                echo "main accepts promotion only from production." >&2
                exit 1
              }
              ;;
            *)
              echo "Unexpected protected target branch: $BASE" >&2
              exit 1
              ;;
          esac
