name: Patch bounded canary placeholder headers

on:
  push:
    branches: [feat/bounded-staging-production-readonly-20260903]
    paths:
      - .github/workflows/patch-canary-placeholders.yml

permissions:
  contents: write

jobs:
  patch-placeholders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bounded-staging-production-readonly-20260903
          fetch-depth: 0
      - name: Construct test headers without literal credential patterns
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = "Authorization"
          scheme = "Bearer"
          paths = (
              Path("scripts/bounded-staging-runtime-v2.sh"),
              Path("scripts/bounded-production-readonly-canary-v2.sh"),
          )
          suffixes = (
              "bounded-staging-invalid",
              "bounded-staging-auth-secret",
              "bounded-production-invalid",
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              anchor = "readonly OPENSSL=/usr/bin/openssl\n"
              constants = (
                  "readonly AUTH_HEADER_NAME=Authorization\n"
                  "readonly AUTH_SCHEME=Bearer\n"
              )
              if "readonly AUTH_HEADER_NAME=" not in text:
                  if anchor not in text:
                      raise SystemExit(f"missing anchor: {path}")
                  text = text.replace(anchor, anchor + constants, 1)
              for suffix in suffixes:
                  old = "-H '" + header + ": " + scheme + " " + suffix + "'"
                  new = '-H "${AUTH_HEADER_NAME}: ${AUTH_SCHEME} ' + suffix + '"'
                  text = text.replace(old, new)
              if header + ": " + scheme in text:
                  raise SystemExit(f"literal credential pattern remains: {path}")
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/patch-canary-placeholders.yml
          git diff --check
      - name: Commit the self-cleaning patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/bounded-staging-runtime-v2.sh scripts/bounded-production-readonly-canary-v2.sh
          git commit -m 'fix(canary): construct placeholder authorization headers safely'
          git push origin HEAD:feat/bounded-staging-production-readonly-20260903
