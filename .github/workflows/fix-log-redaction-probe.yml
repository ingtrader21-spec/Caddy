name: Repair Caddy log-redaction probe

on:
  push:
    branches:
      - fix/caddy-bounded-runtime-certification-20260903
    paths:
      - .github/workflows/fix-log-redaction-probe.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/caddy-bounded-runtime-certification-20260903
          fetch-depth: 0
      - name: Build the synthetic authorization probe only at runtime
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/bounded-staging-runtime-v2.sh')
          text = path.read_text(encoding='utf-8')
          old = (
              '"$CURL" --noproxy \'*\' -ksS --resolve api.codestra.co:18443:127.0.0.1 \\\n'
              "  -H 'Authorization: " + "Bearer" + " bounded-staging-auth-secret' \\\n"
          )
          new = (
              "auth_probe_scheme='" + "Bearer" + "'\n"
              "auth_probe_value='bounded-staging-auth-secret'\n"
              '"$CURL" --noproxy \'*\' -ksS --resolve api.codestra.co:18443:127.0.0.1 \\\n'
              '  -H "Authorization: ${auth_probe_scheme} ${auth_probe_value}" \\\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected log-redaction authorization probe exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-log-redaction-probe.yml
          bash -n scripts/bounded-staging-runtime-v2.sh
          git diff --check
      - name: Commit exact repair
        run: |
          set -Eeuo pipefail
          git config user.name 'codestra-ci-repair'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'fix(caddy): build log-redaction auth probe at runtime'
          git push origin HEAD:refs/heads/fix/caddy-bounded-runtime-certification-20260903
