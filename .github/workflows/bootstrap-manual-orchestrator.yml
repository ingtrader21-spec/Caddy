name: Bootstrap Caddy manual orchestrator source

on:
  push:
    branches:
      - ci/manual-one-click-production-orchestrator-20260903
    paths:
      - .github/workflows/bootstrap-manual-orchestrator.yml

permissions:
  contents: write

jobs:
  materialize-reviewed-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and materialize reviewed source packet
        env:
          PAYLOAD_SHA256: 008dea40f00fb6c1b4c80710f4807035952f963b456e28b58899e285b8337afc
        run: |
          set -Eeuo pipefail
          umask 077
          cat > /tmp/caddy-orchestrator-payload.b64 <<'PAYLOAD'




PAYLOAD
          base64 -d /tmp/caddy-orchestrator-payload.b64 > /tmp/caddy-orchestrator-payload.tar.xz
          test "$(sha256sum /tmp/caddy-orchestrator-payload.tar.xz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xJf /tmp/caddy-orchestrator-payload.tar.xz -C .
          rm -f .github/workflows/bootstrap-manual-orchestrator.yml
          python3 -m py_compile scripts/caddy_manual_orchestrator.py
          python3 -m unittest -v tests/test_manual_production_orchestrator.py
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          value = yaml.load(
              Path('.github/workflows/manual-production-orchestrator.yml').read_text(),
              Loader=yaml.BaseLoader,
          )
          assert value['name'] == 'Manual one-click Caddy production orchestrator'
          assert set(value['jobs']) == {'preflight', 'release', 'runtime', 'verdict'}
          PY
          git diff --check
          git status --short
      - name: Commit the exact reviewed packet
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: add one-click exact-production orchestrator'
          git push origin HEAD:ci/manual-one-click-production-orchestrator-20260903
