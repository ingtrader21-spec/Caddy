name: Validate Caddy source authority

on:
  pull_request:
  push:
    branches: [main, development, test, production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate repository authority and secret-free source
        run: python3 scripts/validate_repository.py
      - name: Reject whitespace errors
        run: git diff --check
