name: Immutable Caddy release

on:
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/immutable-release.yml
  push:
    branches: [production]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache: false
      - name: Build patched Caddy source
        env:
          CADDY_SOURCE_SHA: e2eee6a7fce366321294c9c2a79f3146891dcbdf
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/caddyserver/caddy.git build/caddy-source
          git -C build/caddy-source checkout --detach "$CADDY_SOURCE_SHA"
          cd build/caddy-source
          go get \
            golang.org/x/crypto@v0.55.0 \
            golang.org/x/net@v0.57.0 \
            golang.org/x/text@v0.41.0 \
            google.golang.org/grpc@v1.83.1
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../caddy ./cmd/caddy
          ../caddy version
          ../caddy list-modules --packages > ../caddy-modules.txt
          go version -m ../caddy > ../caddy-go-version.txt
          git diff -- go.mod go.sum > ../caddy-module-overrides.patch
          jq -n \
            --arg repository "https://github.com/caddyserver/caddy" \
            --arg source_sha "$CADDY_SOURCE_SHA" \
            --arg wrapper_sha "$GITHUB_SHA" \
            --arg binary_sha256 "$(sha256sum ../caddy | cut -d' ' -f1)" \
            --arg go_mod_sha256 "$(sha256sum go.mod | cut -d' ' -f1)" \
            --arg go_sum_sha256 "$(sha256sum go.sum | cut -d' ' -f1)" \
            '{schema:"codestra.caddy.binary-build.v1", source_repository:$repository, source_sha:$source_sha, wrapper_sha:$wrapper_sha, binary_sha256:$binary_sha256, go_mod_sha256:$go_mod_sha256, go_sum_sha256:$go_sum_sha256}' \
            > ../caddy-binary-build-attestation.json
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' \
            -o build/codestra-set-bind-capability build-tools/set-bind-capability/main.go
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build exact-head security candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          push: false
          tags: local/codestra-caddy:${{ github.sha }}
          build-args: |
            BUILD_CREATED=${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - name: Prove hardened non-root privileged-port binding
        run: tests/runtime-bind-test.sh local/codestra-caddy:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/codestra-caddy:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codestra-caddy:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_CREATED=${{ github.event.head_commit.timestamp }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: github.event_name == 'push'
      - name: Sign and verify compiled-binary build attestation
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle caddy-binary-build-attestation.bundle \
            build/caddy-binary-build-attestation.json
          cosign verify-blob \
            --bundle caddy-binary-build-attestation.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            build/caddy-binary-build-attestation.json >/dev/null
      - name: Sign and verify immutable digest
        if: github.event_name == 'push'
        env:
          SUBJECT: ghcr.io/${{ github.repository_owner }}/codestra-caddy@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$SUBJECT"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SUBJECT" >/dev/null
          jq -n \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg revision "${GITHUB_SHA}" \
            --arg workflow "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production" \
            --arg release "${GITHUB_SHA}" \
            '{repository:$repository,revision:$revision,workflow_identity:$workflow,release_identity:$release}' \
            > caddy-source-provenance.json
          cosign attest --yes \
            --predicate caddy-source-provenance.json \
            --type https://codestra.co/attestations/caddy-source/v1 \
            "$SUBJECT"
          cosign verify-attestation \
            --type https://codestra.co/attestations/caddy-source/v1 \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SUBJECT" > caddy-source-provenance.verified.json
          printf '%s\n' \
            "SOURCE_SHA=${GITHUB_SHA}" \
            "IMAGE_DIGEST=${{ steps.publish.outputs.digest }}" \
            "SBOM=PASS" \
            "IMAGE_PROVENANCE=PASS" \
            "SOURCE_PROVENANCE=PASS" \
            "BINARY_BUILD_ATTESTATION=PASS" \
            "SIGNATURE=PASS" \
            "VULNERABILITY_GATE=PASS" > caddy-release-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: caddy-release-evidence-${{ github.sha }}
          path: |
            caddy-release-evidence.txt
            build/caddy-binary-build-attestation.json
            caddy-binary-build-attestation.bundle
            caddy-source-provenance.json
            caddy-source-provenance.verified.json
            build/caddy-go-version.txt
            build/caddy-modules.txt
            build/caddy-module-overrides.patch
