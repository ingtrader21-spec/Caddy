name: Immutable Caddy release

on:
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/immutable-release.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/immutable-release.yml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build exact-head security candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: local/codestra-caddy:${{ github.sha }}
          build-args: |
            BUILD_CREATED=${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/codestra-caddy:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codestra-caddy:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_CREATED=${{ github.event.head_commit.timestamp }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: github.event_name == 'push'
      - name: Sign and verify immutable digest
        if: github.event_name == 'push'
        env:
          SUBJECT: ghcr.io/${{ github.repository_owner }}/codestra-caddy@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$SUBJECT"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SUBJECT" >/dev/null
          printf '%s\n' \
            "SOURCE_SHA=${GITHUB_SHA}" \
            "IMAGE_DIGEST=${{ steps.publish.outputs.digest }}" \
            "SBOM=PASS" \
            "PROVENANCE=PASS" \
            "SIGNATURE=PASS" \
            "VULNERABILITY_GATE=PASS" > caddy-release-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: caddy-release-evidence-${{ github.sha }}
          path: caddy-release-evidence.txt
