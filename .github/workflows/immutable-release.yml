name: Immutable Caddy release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact protected production commit to release
        required: true
        type: string
    outputs:
      source_sha:
        description: Exact released production source SHA
        value: ${{ jobs.build-scan-publish.outputs.source_sha }}
      image:
        description: Immutable GHCR image reference
        value: ${{ jobs.build-scan-publish.outputs.image }}
      image_digest:
        description: Immutable OCI digest
        value: ${{ jobs.build-scan-publish.outputs.image_digest }}
      config_sha256:
        description: Canonical config tree digest
        value: ${{ jobs.build-scan-publish.outputs.config_sha256 }}
      release_evidence_sha256:
        description: SHA-256 of the release gate packet
        value: ${{ jobs.build-scan-publish.outputs.release_evidence_sha256 }}
      rollback_evidence_sha256:
        description: SHA-256 of the historical rollback rehearsal packet
        value: ${{ jobs.build-scan-publish.outputs.rollback_evidence_sha256 }}

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: caddy-production-release
  cancel-in-progress: false

jobs:
  build-scan-publish:
    name: publish-signed-production-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      image: ${{ steps.subject.outputs.image }}
      image_digest: ${{ steps.subject.outputs.image_digest }}
      config_sha256: ${{ steps.config.outputs.sha }}
      release_evidence_sha256: ${{ steps.evidence.outputs.release_evidence_sha256 }}
      rollback_evidence_sha256: ${{ steps.evidence.outputs.rollback_evidence_sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CADDY_UPSTREAM_SHA: e2eee6a7fce366321294c9c2a79f3146891dcbdf
      LOCAL_IMAGE: local/codestra-caddy:${{ inputs.source_sha }}
    steps:
      - name: Reject every source except the current protected production head
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/production

      - name: Check out exact production SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - id: identity
        name: Prove protected source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin production --depth=1
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"
          build_created="$(git show -s --format=%cI "$SOURCE_SHA")"
          test -n "$build_created"
          printf 'source_sha=%s\nbuild_created=%s\n' "$SOURCE_SHA" "$build_created" >> "$GITHUB_OUTPUT"

      - name: Pin Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build patched binary and release evidence
        run: bash scripts/build-release-inputs.sh

      - name: Export configuration digest
        id: config
        run: |
          set -Eeuo pipefail
          sha="$(cat build/config-sha256.txt)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          test "$sha" = "$(python3 scripts/hash_config_tree.py config)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build exact production candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            BUILD_CREATED=${{ steps.identity.outputs.build_created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ env.SOURCE_SHA }}
            VERSION=${{ env.SOURCE_SHA }}
            CONFIG_SHA256=${{ steps.config.outputs.sha }}
            CADDY_UPSTREAM_SHA=${{ env.CADDY_UPSTREAM_SHA }}

      - name: Prove non-root privileged-port binding
        run: tests/runtime-bind-test.sh "$LOCAL_IMAGE"

      - name: Run isolated production-candidate canary
        run: tests/runtime-canary-test.sh "$LOCAL_IMAGE" | tee caddy-canary-evidence.txt

      - name: Scan production candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify and boot the immutable rollback baseline
        run: scripts/verify-rollback-baseline.sh | tee caddy-rollback-baseline-evidence.txt

      - name: Publish immutable digest with SBOM and provenance
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codestra-caddy:${{ env.SOURCE_SHA }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_CREATED=${{ steps.identity.outputs.build_created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ env.SOURCE_SHA }}
            VERSION=${{ env.SOURCE_SHA }}
            CONFIG_SHA256=${{ steps.config.outputs.sha }}
            CADDY_UPSTREAM_SHA=${{ env.CADDY_UPSTREAM_SHA }}

      - id: subject
        name: Bind the immutable image identity
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/codestra-caddy@${PUBLISHED_DIGEST}"
          printf 'image=%s\nimage_digest=%s\n' "$image" "$PUBLISHED_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign and verify compiled-binary build attestation
        run: |
          set -Eeuo pipefail
          cosign sign-blob --yes \
            --bundle caddy-binary-build-attestation.bundle \
            build/caddy-binary-build-attestation.json
          cosign verify-blob \
            --bundle caddy-binary-build-attestation.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            build/caddy-binary-build-attestation.json >/dev/null

      - name: Sign, attest, and verify immutable image
        env:
          SUBJECT: ${{ steps.subject.outputs.image }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "$SUBJECT"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SUBJECT" >/dev/null
          jq -n \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg revision "$SOURCE_SHA" \
            --arg workflow "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production" \
            --arg release "$SOURCE_SHA" \
            --arg config_sha256 "$(cat build/config-sha256.txt)" \
            '{repository:$repository,revision:$revision,workflow_identity:$workflow,release_identity:$release,config_sha256:$config_sha256}' \
            > caddy-source-provenance.json
          cosign attest --yes \
            --predicate caddy-source-provenance.json \
            --type https://codestra.co/attestations/caddy-source/v2 \
            "$SUBJECT"
          cosign verify-attestation \
            --type https://codestra.co/attestations/caddy-source/v2 \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/immutable-release.yml@refs/heads/production$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$SUBJECT" > caddy-source-provenance.verified.json
          printf '%s\n' \
            "SOURCE_SHA=$SOURCE_SHA" \
            "IMAGE=$SUBJECT" \
            "IMAGE_DIGEST=${{ steps.subject.outputs.image_digest }}" \
            "CONFIG_SHA256=$(cat build/config-sha256.txt)" \
            "SBOM=PASS" \
            "IMAGE_PROVENANCE=PASS" \
            "SOURCE_PROVENANCE=PASS" \
            "BINARY_BUILD_ATTESTATION=PASS" \
            "SIGNATURE=PASS" \
            "VULNERABILITY_GATE=PASS" \
            "CANARY_CERTIFICATION=PASS" \
            "HTTP3_CANARY=PASS" \
            "ROLLBACK_BASELINE=PASS" \
            "ROLLBACK_REHEARSAL=PASS" > caddy-release-evidence.txt

      - id: evidence
        name: Bind release and rollback evidence digests
        run: |
          set -Eeuo pipefail
          test -s caddy-release-evidence.txt
          test -s caddy-rollback-baseline-evidence.txt
          printf 'release_evidence_sha256=%s\nrollback_evidence_sha256=%s\n' \
            "$(sha256sum caddy-release-evidence.txt | awk '{print $1}')" \
            "$(sha256sum caddy-rollback-baseline-evidence.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Preserve GitHub release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: ${{ steps.subject.outputs.image }}
        run: |
          set -Eeuo pipefail
          tag="caddy-production-$SOURCE_SHA"
          notes="Signed Caddy production image: $SUBJECT"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$SOURCE_SHA" \
              --title "Caddy production $SOURCE_SHA" --notes "$notes"

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-release-evidence-${{ env.SOURCE_SHA }}
          path: |
            caddy-release-evidence.txt
            caddy-canary-evidence.txt
            caddy-rollback-baseline-evidence.txt
            build/caddy-binary-build-attestation.json
            caddy-binary-build-attestation.bundle
            caddy-source-provenance.json
            caddy-source-provenance.verified.json
            build/config-sha256.txt
            build/caddy-go-version.txt
            build/http3-probe-go-version.txt
            build/caddy-modules.txt
            build/caddy-module-overrides.patch
          if-no-files-found: error
